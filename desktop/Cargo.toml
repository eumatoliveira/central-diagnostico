[package]
name = "central-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
central-agente = { path = "../agente" }
central-relatorios = { path = "../relatorios" }
central-relatorio-pdf = { path = "../relatorio-pdf" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = "=0.18.0"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
